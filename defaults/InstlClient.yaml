--- !define

PARALLEL_SYNC: 50
CURL_CONFIG_FILE_NAME: dl
CURL_CONNECT_TIMEOUT: 64 # Maximum time in seconds that you allow curl's connection to take. This only limits the connection phase, so if curl connects within the given period it will continue - if not it will exit.
CURL_MAX_TIME: 600       # Maximum time in seconds that you allow each transfer  to take. This is useful for preventing your batch jobs from hanging for hours due to slow networks or links going down.
CURL_RETRIES: 12          # If a transient error is returned when curl tries to perform a transfer, it will retry this number of times before giving up. Setting the number to 0 makes curl do no retries (which is the default).
CURL_RETRY_DELAY: 12     # Make curl sleep this amount of time before each retry when a transfer has failed with a transient error (it changes the default backoff time algorithm between retries).

DOWNLOAD_RESUME_ENABLED: yes
DOWNLOAD_RESUME_REQUIRE_CONDITIONAL: no
DOWNLOAD_RESUME_MIN_SIGNED_URL_TTL_SECONDS: 300
# Left empty by default; the resume-capability check derives the host from
# BASE_LINKS_URL (passed in by Central per install) when this list is empty,
# so the validated host always matches the CDN the install is actually using.
DOWNLOAD_RESUME_VALIDATED_HOSTS: []
DOWNLOAD_RESUME_VALIDATED_PATH_PREFIXES:
    - /$(REPO_NAME)/

# Parallelization of the CPU-bound post-download stages (perf work). Each is a
# kill switch so a stage can fall back to the original serial path if a problem
# surfaces. DOWNLOAD_PARALLEL_WORKERS = 0 means "auto" (os.cpu_count()).
# - DOWNLOAD_PARALLEL_UNWTAR: extract wtar archives across a process pool
#   (decompression is CPU-bound and was fully serial).
# - DOWNLOAD_PARALLEL_VERIFY:  hash files in the checksum-verify pass across a
#   pool instead of one-at-a-time on a single core.
# - DOWNLOAD_CURL_HTTP2: request HTTP/2 in the curl config (multiplex many
#   small transfers over fewer connections); falls back to HTTP/1.1 if the
#   server/proxy doesn't support it.
DOWNLOAD_PARALLEL_UNWTAR: yes
DOWNLOAD_PARALLEL_VERIFY: yes
DOWNLOAD_PARALLEL_WORKERS: 0
DOWNLOAD_CURL_HTTP2: yes

# Each behavior is independently gated so it can be turned off in the field
# without a code change; the boolean gates are surfaced on the
# download.capability event's featureFlags so Central and telemetry can see
# which layers are active.
#
# DOWNLOAD_TELEMETRY_ENABLED gates the DOWNLOAD_EVENT structured channel
# (see pyinstl/downloadEvents.py). When `no`, builders/emitters become
# no-ops so older Central builds (or operators rolling back) keep parsing
# the legacy text log only. The DOWNLOAD_RETRY_DECISION text line stays
# emitted unchanged for backward compatibility.
#
# DOWNLOAD_RETRY_POLICY_ENABLED gates the matrix-driven retry decision
# (see pyinstl/downloadRetry.py). When `no`, info_mapBatchCommands skips
# the structured retry-decision log/event and sidecar retry bookkeeping;
# the existing redownload loop still drives the actual retransfer.
#
# DOWNLOAD_CENTRAL_UX_ENABLED is echoed onto the capability event so
# Central can hide new recovery actions/dialogs even when the backend
# capability set is otherwise satisfied. This is the rollback hatch for
# the UX layer.
DOWNLOAD_TELEMETRY_ENABLED: yes
DOWNLOAD_RETRY_POLICY_ENABLED: yes
DOWNLOAD_CENTRAL_UX_ENABLED: yes

# Connectivity-loss self-sufficiency (offline-hold / completeness
# reconciliation / stall watchdog). Each behavior is an independent kill
# switch, default ON, following the DOWNLOAD_* rollout pattern above; the
# boolean gates are surfaced on the download.capability event's featureFlags
# so Central and telemetry can see which layers are active. Turning any of
# them off restores the previous (macOS-validated) behavior with no code
# change.
#
# - DOWNLOAD_RECONCILE_MISSING_OUTPUTS: `curl --parallel` can exit 0 while
#   individual transfers failed permanently (their internal retries were
#   exhausted while offline), leaving files with no .part at all. When on,
#   after curl exits 0 the engine checks every expected output on disk and
#   re-runs curl with a config containing only the missing entries
#   (preserving each entry's original url/output/continue-at/header lines),
#   up to DOWNLOAD_RECONCILE_MAX_ROUNDS rounds. The checksum phase remains
#   the final gate.
# - DOWNLOAD_OFFLINE_HOLD_ENABLED: on a network-class curl exit the engine
#   probes connectivity itself (TCP connect to the BASE_LINKS_URL host --
#   or, when proxy env vars are set, to the proxy, since curl transfers go
#   through it; DOWNLOAD_OFFLINE_PROBE_TIMEOUT_SECONDS per probe) instead of
#   blindly burning the bounded retry budget. While offline it holds --
#   probing every DOWNLOAD_OFFLINE_PROBE_INTERVAL_SECONDS -- until
#   connectivity returns or the overall (cumulative, ACTIVE time only: time
#   spent client-paused is excluded) DOWNLOAD_OFFLINE_HOLD_TIMEOUT_SECONDS
#   budget is spent, after which the old retries-exhausted path applies.
#   Pause/resume/try_now from Central still interrupt the hold. The
#   network-class retry_decision events per failed probe and the
#   offline-reason paused session_state (throttled to
#   DOWNLOAD_OFFLINE_HOLD_EVENT_INTERVAL_SECONDS) are emitted ONLY when
#   DOWNLOAD_CLIENT_HANDLES_BACKEND_HOLD is on (see below) -- the hold
#   itself is silent-recovery otherwise, so an old Central sees exactly the
#   legacy event stream.
# - DOWNLOAD_CURL_STALL_DETECTION: adds speed-limit/speed-time to the
#   generated curl configs so a silently stalled transfer (no bytes for
#   DOWNLOAD_CURL_SPEED_TIME seconds below DOWNLOAD_CURL_SPEED_LIMIT
#   bytes/sec) exits 28 (network-class) instead of hanging forever, feeding
#   the offline-hold loop above. DOWNLOAD_STALL_WATCHDOG_SECONDS is the
#   observability backstop: the .part-size poller logs and emits a
#   stalled-flavored session_state when total bytes have not grown for that
#   long while curl is alive (it never kills curl; 0 disables).
# - DOWNLOAD_STALL_PROBE_SECONDS: fast offline detection. A mid-transfer
#   link drop merely stalls curl's sockets (no exit code until speed-time),
#   so the .part-size poller -- which notices frozen bytes within a tick --
#   probes connectivity after this many seconds of zero byte growth and,
#   when the probe fails, raises the paused/offline_no_network hold events
#   immediately (curl keeps running; the hold is released by
#   resuming_after_offline only when bytes actually grow again). This is
#   what gets the Central UI into pause mode within seconds of pulling the
#   plug instead of after speed-time. 0 disables; emissions remain gated by
#   DOWNLOAD_CLIENT_HANDLES_BACKEND_HOLD.
DOWNLOAD_RECONCILE_MISSING_OUTPUTS: yes
DOWNLOAD_RECONCILE_MAX_ROUNDS: 3
DOWNLOAD_OFFLINE_HOLD_ENABLED: yes
DOWNLOAD_OFFLINE_HOLD_TIMEOUT_SECONDS: 1800
DOWNLOAD_OFFLINE_PROBE_INTERVAL_SECONDS: 5
DOWNLOAD_OFFLINE_PROBE_TIMEOUT_SECONDS: 5
DOWNLOAD_OFFLINE_HOLD_EVENT_INTERVAL_SECONDS: 30
DOWNLOAD_CURL_STALL_DETECTION: yes
DOWNLOAD_CURL_SPEED_LIMIT: 1
DOWNLOAD_CURL_SPEED_TIME: 30
DOWNLOAD_STALL_WATCHDOG_SECONDS: 180
DOWNLOAD_STALL_PROBE_SECONDS: 8

# Capability handshake with the client driving this engine (Waves Central).
# When ON, the engine emits the NEW backend-hold observability events: the
# bulk-loop network-class download.retry_decision events and the
# offline-hold / stall / reconcile session_state events. A NEW Central sets
# this var to true in the download settings it injects into the generated
# yaml, and treats those backend-derived signals as INFORMATIONAL (it never
# sends a stdin pause for them -- the engine is already holding and resumes
# itself). The default here is OFF because an OLD Central's 3-streak online
# detector would respond to a burst of network-class retry_decisions with a
# pause that nothing auto-resumes on Windows (navigator.onLine lies),
# deadlocking the engine in wait_if_paused. With the var off ALL silent
# recovery above (reconciliation, offline-hold, stall detection, redownload
# budgets) still runs -- only the legacy log lines / event stream are
# produced, so an old Central cannot be tripped into a pause storm.
DOWNLOAD_CLIENT_HANDLES_BACKEND_HOLD: no

# Recovery-cliff removal in the checksum-verify phase. The verify pass used
# to stop counting at MAX_BAD_FILES_TO_REDOWNLOAD+1 bad/missing files and
# skip the pause-aware redownload pass entirely — e.g. 33 files missing after
# an offline window with a cap of 32 failed the whole install with ZERO
# recovery attempts even though connectivity was back.
# - DOWNLOAD_REDOWNLOAD_ALL_BAD_FILES: when on, the verify loop counts ALL
#   bad/missing files (per-file bad lines are throttled past the threshold so
#   large counts don't flood the log) and the redownload pass ALWAYS runs,
#   protected by the budgets below instead of a count cliff.
#   MAX_BAD_FILES_TO_REDOWNLOAD (InstlClientSync.yaml) is reinterpreted as a
#   warn threshold (None/0 still means "verify only, no redownload"). Turning
#   this off restores the legacy (macOS-validated) count-cliff behavior.
# - DOWNLOAD_REDOWNLOAD_MAX_TOTAL_BYTES / DOWNLOAD_REDOWNLOAD_MAX_SECONDS:
#   OPT-IN budgets for the redownload pass; 0 (the default for both) means
#   unlimited, preserving the legacy always-completes recovery -- the legacy
#   path recovered every bad file within the count cap no matter how long it
#   took, and a non-zero default here would abandon slow-network recoveries
#   that used to succeed. When set, the budget is checked between files (a
#   file in flight is never abandoned) and time spent paused (user pause /
#   offline auto-pause) does not count against the seconds budget. Files
#   beyond an exhausted budget are left unrecovered and reported by the
#   existing 'Bad checksum for N files / Missing M files' error that Central
#   already parses.
DOWNLOAD_REDOWNLOAD_ALL_BAD_FILES: yes
DOWNLOAD_REDOWNLOAD_MAX_TOTAL_BYTES: 0
DOWNLOAD_REDOWNLOAD_MAX_SECONDS: 0

LOCAL_SYNC_DIR: $(USER_CACHE_DIR)/$(S3_BUCKET_NAME)
LOCAL_REPO_SYNC_DIR: $(LOCAL_SYNC_DIR)/$(REPO_NAME)
LOCAL_REPO_BOOKKEEPING_DIR: $(LOCAL_REPO_SYNC_DIR)/bookkeeping
HAVE_INFO_MAP_FILE_NAME: have_info_map.txt
HAVE_INFO_MAP_PATH: $(LOCAL_REPO_BOOKKEEPING_DIR)/$(HAVE_INFO_MAP_FILE_NAME)
# copy might read NEW_HAVE_INFO_MAP_PATH copy.sh is created before sync.sh was ran
# this will be indicated in the copy.yaml file
HAVE_INFO_MAP_COPY_PATH: $(NEW_HAVE_INFO_MAP_PATH)
NEW_HAVE_INFO_MAP_PATH: $(LOCAL_REPO_BOOKKEEPING_DIR)/new_$(HAVE_INFO_MAP_FILE_NAME)
REQUIRED_INFO_MAP_PATH: $(LOCAL_REPO_BOOKKEEPING_DIR)/required_info_map.txt
TO_SYNC_INFO_MAP_PATH: $(LOCAL_REPO_BOOKKEEPING_DIR)/to_sync_info_map.txt
LOCAL_REPO_REV_BOOKKEEPING_DIR: $(LOCAL_REPO_BOOKKEEPING_DIR)/$(REPO_REV)
LOCAL_COPY_OF_REMOTE_INFO_MAP_PATH: $(LOCAL_REPO_REV_BOOKKEEPING_DIR)/remote_info_map.txt

# VENDOR_DIR_NAME should be overridden by the index.yaml file to reflect the specific vendor that created the install
VENDOR_DIR_NAME: ACME
SITE_BOOKKEEPING_DIR: $(__SITE_CONFIG_DIR__)
SITE_VENDOR_BOOKKEEPING_DIR: $(SITE_BOOKKEEPING_DIR)/$(VENDOR_DIR_NAME)
SITE_REPO_BOOKKEEPING_DIR: $(SITE_VENDOR_BOOKKEEPING_DIR)/$(REPO_NAME)
SITE_HAVE_INFO_MAP_PATH: $(SITE_REPO_BOOKKEEPING_DIR)/$(HAVE_INFO_MAP_FILE_NAME)

SITE_REQUIRE_FILE_NAME: require.yaml
SITE_REQUIRE_FILE_PATH: $(SITE_REPO_BOOKKEEPING_DIR)/$(SITE_REQUIRE_FILE_NAME)
NEW_SITE_REQUIRE_FILE_PATH: $(SITE_REPO_BOOKKEEPING_DIR)/new_$(SITE_REQUIRE_FILE_NAME)
OLD_SITE_REQUIRE_FILE_PATH: $(SITE_REPO_BOOKKEEPING_DIR)/old_$(SITE_REQUIRE_FILE_NAME)

# By default source folder are specified in the index without the OS prefix (Mac/Win)
SOURCE_PREFIX: $(TARGET_OS)

# during copy stage, if pathlib.Path.match returns true for one of these - file/dir will not be copied
COPY_IGNORE_PATTERNS:
    - "*.wtar.??"
    - "*.wtar"
    - "*.done"
    - "._*"

# during copy stage, if pathlib.Path.match returns true for one of these - file will not be hard-linked
NO_HARD_LINK_PATTERNS:
    - "*Info.xml"
    - "*Info.plist"
    - "desktop.ini"
    - "*.ico"

# during copy stage, if pathlib.Path.match returns true for one of these - destination file (if exist) flags such as hidden, system, read-only will be removed
NO_FLAGS_PATTERNS:
    - "desktop.ini"
    - "*.ico"

# during copy stage, if one of these files exists in both source and destination and has same checksum, the whole dir will not be copied
AVOID_COPY_MARKERS:
    - Info.xml
    - Info.plist

RSYNC_PERM_OPTIONS: a+rw,+X

WTAR_RATIO: 1.3

# usually copy is done from the sync folder, but using a separate variable
# allows us to specify a different folder
COPY_SOURCES_ROOT_DIR: $(LOCAL_REPO_SYNC_DIR)

# if require.yaml exists REQUIRE_REPO_REV will be overridden
REQUIRE_REPO_REV: 0

# default version for iids that do not have explicitly version
DEFAULT_IID_VERSION: 0.0.0

OUTPUT_FORMAT: $(__OUTPUT_FORMAT__)

# should index items under "previous_sources" be removed?
REMOVE_PREVIOUS_SOURCES: yes

# in case of an error, value of these configVars will appear in the error report
CONFIG_VARS_FOR_ERROR_REPORT:
    - REPO_REV
    - REQUIRE_REPO_REV
    - BASE_LINKS_URL
    - S3_BUCKET_NAME
    - REPO_NAME

--- !define_Mac
REMOVE_EMPTY_FOLDERS_IGNORE_FILES:
    - .DS_Store
    - "Icon.*"

--- !define_Win
REMOVE_EMPTY_FOLDERS_IGNORE_FILES:
    - desktop.ini
    - Folder.ico
